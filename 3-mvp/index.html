<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué meme eres?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../compartido/estilos.css">
  <link rel="stylesheet" href="estilos-mvp.css">

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ml5@1.2.1/dist/ml5.min.js"></script>
</head>
<body>
  <main class="pagina filtro">
    <header class="encabezado">
      <h1>¿Qué meme eres?
        <span class="modelo">faceMesh + handPose + red neuronal entrenada por nosotros</span>
      </h1>
      <div class="acciones-encabezado">
        <a class="boton-volver" href="../1-presentacion/index.html#mvp-memes">← Volver a la presentación</a>
        <a class="volver" href="entrenar.html">Entrenar</a>
      </div>
    </header>

    <!-- Dos columnas del mismo tamaño: cámara | meme -->
    <div class="zona">
      <div>
        <div class="camara" id="camara">
          <p class="estado" id="estado">Cargando los modelos…</p>
        </div>
        <p class="rendimiento" id="fps">— cuadros por segundo</p>
        <p class="idea">Tecla <strong>P</strong>: mostrar u ocultar los puntos que recibe la red.</p>
      </div>

      <aside>
        <div class="meme">
          <img id="meme-imagen" alt="" hidden>
          <video id="meme-video" muted loop playsinline hidden></video>
          <!-- El nombre va encima de la imagen para ahorrar espacio -->
          <p class="meme-nombre" id="meme-nombre">—</p>
        </div>

        <h2 class="titulo-ranking">Lo que piensa la red</h2>
        <ul class="partes" id="ranking"></ul>
      </aside>
    </div>

    <!-- Galería: todos los memes que la red conoce (la llena sketch.js) -->
    <section class="galeria-seccion">
      <h2>Memes que puedes ser</h2>
      <ul class="galeria" id="galeria"></ul>
    </section>
  </main>

  <script src="memes.js"></script>
  <script src="entradas.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
